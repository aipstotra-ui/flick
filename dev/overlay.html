<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Overlay demo</title>
    <style>
      body { margin: 0; background: #0f0f0f; font: 14px system-ui; color: #ddd; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; }
      video { width: 800px; max-width: 100%; aspect-ratio: 16/9; border-radius: 12px; background: #222; }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      button { background: #272727; color: #eee; border: 0; border-radius: 18px; padding: 8px 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <video id="v" muted></video>
    <div class="controls">
      <button data-a="hand">Hand ready</button>
      <button data-a="pinch">Pinching</button>
      <button data-a="hold">Holding thumbs up</button>
      <button data-a="toast">Toast +10 s</button>
      <button data-a="like">Toast liked</button>
      <button data-a="scrub">Scrub meter</button>
      <button data-a="volume">Volume meter</button>
      <button data-a="clear">Clear</button>
    </div>
    <script src="/extension/src/content/overlay.js"></script>
    <script>
      // A moving picture for the video, so the glass has something to blur.
      const c = Object.assign(document.createElement("canvas"), { width: 1280, height: 720 });
      const ctx = c.getContext("2d");
      let t = 0;
      (function paint() {
        t += 0.01;
        const g = ctx.createLinearGradient(0, 0, 1280, 720);
        g.addColorStop(0, `hsl(${(t * 40) % 360} 60% 45%)`);
        g.addColorStop(1, `hsl(${(t * 40 + 120) % 360} 55% 30%)`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 1280, 720);
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.beginPath();
        ctx.arc(640 + Math.sin(t) * 300, 360 + Math.cos(t * 1.3) * 150, 90, 0, 7);
        ctx.fill();
        requestAnimationFrame(paint);
      })();
      const v = document.getElementById("v");
      v.srcObject = c.captureStream(30);
      v.play();
      const base = { present: true, armed: true, x: 0.62, y: 0.42, pose: "open" };
      const acts = {
        hand: () => HTOverlay.hand(base, { video: v }),
        pinch: () => HTOverlay.hand({ ...base, pose: "pinch" }, { video: v }),
        hold: () => HTOverlay.hand({ ...base, pose: "thumbs_up", hold: { name: "thumbs_up", progress: 0.6 } }, { video: v }),
        toast: () => HTOverlay.toast(v, "forward", "+10 s", "1:42"),
        like: () => HTOverlay.toast(v, "like", "Liked"),
        scrub: () => HTOverlay.meter(v, "seek", 0.42, { label: "1:23", sub: "+0:15" }),
        volume: () => HTOverlay.meter(v, "volume", 0.7, { label: "70%" }),
        clear: () => { HTOverlay.endMeter(); HTOverlay.hand(null, {}); },
      };
      document.querySelector(".controls").addEventListener("click", (e) => acts[e.target.dataset.a]?.());
      acts.hand();
    </script>
  </body>
</html>
